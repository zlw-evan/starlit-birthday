<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0919">
  <meta name="description" content="打开一颗祝福爱心，在星河下点亮生日蜡烛，给新的一岁许个愿。">
  <title>今夜，星河为你亮起</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="birthday.js" defer></script>
</head>
<body>
  <main class="scene" id="scene" data-stage="welcome" aria-labelledby="title">
      <div class="nebula" aria-hidden="true"></div>
      <canvas id="starfield" aria-hidden="true"></canvas>
      <div class="intro">
        <h1 id="title" tabindex="-1">今夜，星河<br><em>为你亮起</em></h1>
        <p id="description">有一颗爱心，装着给你的祝福。<br>还有一块星河蛋糕，等你亲手点亮。</p>
      </div>

      <div class="visual">
        <div class="art" id="art">
          <canvas id="cake" role="img" aria-label="一块环绕着流动星光的紫色星河蛋糕"></canvas>
          <button class="candle-hit" type="button" id="candle" hidden><span class="sr-only" id="candleLabel">点亮蜡烛</span></button>
          <div class="heart-scene" id="heartScene" hidden>
            <div class="heart-cards" id="heartCards"></div>
            <p class="heart-note" id="heartNote" aria-live="polite"></p>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="primary"><span id="actionIcon" aria-hidden="true">♡</span><span id="actionText">打开生日惊喜</span></button>
        <button type="button" class="secondary" id="share" hidden>复制祝福链接</button>
      </div>

      <div class="dock">
        <nav class="chapters" aria-label="生日惊喜进度">
          <button type="button" data-go="welcome" aria-current="step" aria-label="星河来信" title="星河来信">✧</button>
          <button type="button" data-go="heart" aria-label="爱心祝福" title="爱心祝福">♡</button>
          <button type="button" data-go="cake" aria-label="星河蛋糕" title="星河蛋糕">✦</button>
        </nav>
        <button class="sound" id="sound" type="button" aria-label="背景音乐" aria-pressed="false" title="播放音乐"><span aria-hidden="true">♫</span></button>
        <details class="track">
          <summary aria-label="曲目信息" title="曲目信息">ⓘ</summary>
          <div class="track-credit">
            <a href="https://freemusicarchive.org/music/Josh_Woodward/The_Wake_1790/JoshWoodward-TheWake-04-CrazyGlue_1790/" lang="en">Crazy Glue · Josh Woodward</a>
            <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
          </div>
        </details>
      </div>
      <audio id="music" src="crazy-glue.mp3" preload="none" loop></audio>
      <p class="sr-only" role="status" id="status"></p>
  </main>

  <dialog id="shareDialog" aria-labelledby="shareTitle">
    <form method="dialog">
      <h2 id="shareTitle">分享生日祝福</h2>
      <label for="shareUrl">长按或选中文字，复制链接</label>
      <input type="url" id="shareUrl" readonly>
      <button type="submit" class="primary">完成</button>
    </form>
  </dialog>
  <noscript><p class="no-script">启用 JavaScript 后，就能打开祝福和点亮蜡烛。</p></noscript>
</body>
</html>
